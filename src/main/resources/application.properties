server.port=8081
spring.application.name=patient-management-service

# MongoDB
#spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:${MONGODB_URI:mongodb+srv://dbuser:dbuser2026@test.ubtlnvl.mongodb.net/client?appName=TEST}}
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:${MONGODB_URI:mongodb://localhost:27017/HealthCare}}
spring.data.mongodb.auto-index-creation=true

file.upload-dir=./uploads
logging.level.org.mongodb.driver.cluster=WARN

# JWT
# Recommended: set JWT_SECRET env var in production.
jwt.secret=${JWT_SECRET:dev-secret-change-me}
# 1 day in milliseconds
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# RabbitMQ (event-driven integration)
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

healthcare.user-events.exchange=${USER_EVENTS_EXCHANGE:healthcare.user.events}