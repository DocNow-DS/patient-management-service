server.port=8081
spring.application.name=patient-management-service
# Default to local MongoDB for dev (matches README/k8s).
# Override with either MONGODB_URI or Spring's standard SPRING_DATA_MONGODB_URI env var.
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/patientdb}
spring.data.mongodb.auto-index-creation=true
file.upload-dir=${FILE_UPLOAD_DIR:./uploads}

# Reduce noisy driver logs when MongoDB is down.
logging.level.org.mongodb.driver.cluster=WARN